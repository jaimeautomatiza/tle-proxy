name: Fetch Mars Rover Trail

on:
  schedule:
    - cron: '23 */6 * * *'  # cada 6 horas, en el minuto 23 (así no coincide con fetch-tle ni con el minuto 0, el más saturado)
  workflow_dispatch:

jobs:
  fetch-rover-trail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update rover trails
        run: python3 scripts/update_rover_trail.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/curiosity-trail.json data/perseverance-trail.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update rover trails [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            # Este repositorio tiene otro workflow (fetch-tle) que también
            # empuja datos. Si ha empujado mientras tanto, el push se rechaza:
            # traemos sus cambios y repetimos, en vez de fallar.
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push correcto (intento $i)."
                exit 0
              fi
              echo "Push fallido (intento $i). Reintentando..."
              sleep $((i * 5))
              git pull --rebase --autostash || true
            done
            echo "::error::No se pudo empujar tras 5 intentos."
            exit 1
          fi